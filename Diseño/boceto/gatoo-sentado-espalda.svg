<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 26 40" width="156" height="240">
  <defs>
    <style>
      .o  { fill: #18181b; }
      .g1 { fill: #757980; }
      .g2 { fill: #52555c; }
      .g3 { fill: #989ca3; }
      .w  { fill: #f4f4f6; }
      .p  { fill: #e39696; }
      .s1 { fill: #d6cfc2; }
      .s2 { fill: #b5ada0; }
      .t  { fill: #2f3136; }
      .t2 { fill: #1f2024; }
      .b  { fill: #4a3728; }
    </style>
  </defs>

  <!-- Piernas flexionadas hacia arriba-derecha (detrás del torso en perspectiva) -->
  <rect class="o" x="16" y="25" width="5" height="1" />
  <rect class="o" x="21" y="26" width="1" height="7" />
  <rect class="o" x="16" y="30" width="2" height="4" />
  <rect class="t" x="16" y="26" width="5" height="4" />
  <rect class="t2" x="19" y="26" width="2" height="7" />
  <rect class="t" x="17" y="30" width="2" height="3" />

  <!-- Zapato asomando -->
  <rect class="o" x="19" y="32" width="5" height="3" />
  <rect class="b" x="20" y="33" width="3" height="1" />

  <!-- Orejas vistas desde atrás -->
  <!-- Oreja izquierda (primer plano) -->
  <rect class="o" x="5" y="2" width="2" height="1" />
  <rect class="o" x="4" y="3" width="1" height="4" />
  <rect class="o" x="7" y="3" width="1" height="2" />
  <rect class="g1" x="5" y="3" width="2" height="4" />
  <rect class="g2" x="5" y="4" width="1" height="2" />

  <!-- Oreja derecha (fondo) -->
  <rect class="o" x="15" y="2" width="2" height="1" />
  <rect class="o" x="14" y="3" width="1" height="2" />
  <rect class="o" x="17" y="3" width="1" height="4" />
  <rect class="g1" x="15" y="3" width="2" height="4" />
  <rect class="p" x="16" y="4" width="1" height="2" />

  <!-- Cabeza contorno (nuca) -->
  <rect class="o" x="8" y="4" width="6" height="1" />
  <rect class="o" x="4" y="7" width="1" height="8" />
  <rect class="o" x="18" y="7" width="1" height="8" />
  <rect class="o" x="5" y="15" width="2" height="1" />
  <rect class="o" x="16" y="15" width="2" height="1" />
  <rect class="o" x="7" y="16" width="9" height="1" />

  <!-- Relleno Nuca -->
  <rect class="g1" x="5" y="5" width="13" height="11" />
  <rect class="g3" x="6" y="5" width="11" height="2" />
  <!-- Rayas en la nuca -->
  <rect class="g2" x="9" y="5" width="1" height="3" />
  <rect class="g2" x="11" y="5" width="1" height="4" />
  <rect class="g2" x="13" y="5" width="1" height="3" />
  <rect class="g2" x="5" y="10" width="3" height="1" />
  <rect class="g2" x="5" y="13" width="2" height="1" />
  <!-- Perfil hocico asomando a la derecha -->
  <rect class="w" x="16" y="12" width="2" height="3" />
  <rect class="o" x="19" y="12" width="1" height="1" />

  <!-- Espalda / Camisa -->
  <rect class="o" x="6" y="17" width="11" height="1" />
  <rect class="o" x="5" y="18" width="1" height="9" />
  <rect class="o" x="17" y="18" width="1" height="8" />
  <rect class="s1" x="6" y="18" width="11" height="8" />
  <rect class="s2" x="6" y="18" width="4" height="8" />
  <!-- Pliegue central de la camisa -->
  <rect class="s2" x="11" y="18" width="1" height="8" />
  <!-- Cuello de camisa trasero -->
  <rect class="w" x="8" y="17" width="6" height="1" />

  <!-- Brazo delantero flexionado hacia adelante-derecha -->
  <rect class="o" x="4" y="18" width="2" height="1" />
  <rect class="o" x="3" y="19" width="1" height="6" />
  <rect class="o" x="4" y="25" width="5" height="1" />
  <rect class="o" x="7" y="20" width="1" height="4" />
  <rect class="o" x="8" y="24" width="2" height="1" />
  <rect class="s1" x="4" y="19" width="3" height="5" />
  <rect class="s2" x="4" y="19" width="2" height="6" />
  <rect class="w" x="8" y="23" width="2" height="1" />

  <!-- Cinturón y Cadera sentada -->
  <rect class="o" x="6" y="26" width="11" height="1" />
  <rect class="o" x="5" y="27" width="1" height="4" />
  <rect class="o" x="6" y="31" width="11" height="1" />
  <rect class="o" x="16" y="27" width="1" height="4" />
  <rect class="t" x="6" y="27" width="10" height="4" />
  <rect class="t2" x="6" y="27" width="3" height="4" />
  <rect class="t2" x="11" y="27" width="1" height="4" />

  <!-- Cola (en primer plano bajando por la espalda-izquierda) -->
  <rect class="o" x="6" y="28" width="3" height="1" />
  <rect class="o" x="4" y="29" width="2" height="1" />
  <rect class="o" x="3" y="30" width="1" height="4" />
  <rect class="o" x="6" y="30" width="1" height="4" />
  <rect class="o" x="4" y="34" width="2" height="1" />
  <rect class="g1" x="6" y="29" width="2" height="1" />
  <rect class="g2" x="4" y="30" width="2" height="1" />
  <rect class="g1" x="4" y="31" width="2" height="2" />
  <rect class="w" x="4" y="33" width="2" height="1" />
</svg>