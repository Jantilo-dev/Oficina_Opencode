<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 26 40" width="156" height="240">
  <defs>
    <style>
      .o  { fill: #18181b; } /* Contorno negro */
      .g1 { fill: #757980; } /* Pelaje gris medio */
      .g2 { fill: #52555c; } /* Pelaje gris oscuro / rayas */
      .g3 { fill: #989ca3; } /* Pelaje gris claro */
      .w  { fill: #f4f4f6; } /* Blanco hocico / patas */
      .p  { fill: #e39696; } /* Rosa orejas / nariz */
      .e  { fill: #3b82f6; } /* Ojos azules */
      .s1 { fill: #d6cfc2; } /* Camisa beige */
      .s2 { fill: #b5ada0; } /* Sombra camisa */
      .t  { fill: #2f3136; } /* Corbata / pantalón */
      .t2 { fill: #1f2024; } /* Sombra pantalón */
      .b  { fill: #4a3728; } /* Zapatos */
      .l  { fill: #9ca3af; } /* Gafete / hebilla */
    </style>
  </defs>

  <!-- Cola (asomando atrás a la izquierda) -->
  <rect class="o" x="1" y="25" width="3" height="1" />
  <rect class="o" x="0" y="26" width="1" height="3" />
  <rect class="o" x="4" y="26" width="1" height="2" />
  <rect class="o" x="1" y="29" width="3" height="1" />
  <rect class="g1" x="2" y="26" width="2" height="1" />
  <rect class="g2" x="1" y="27" width="2" height="1" />
  <rect class="w" x="1" y="28" width="2" height="1" />

  <!-- Orejas -->
  <rect class="o" x="5" y="2" width="2" height="1" />
  <rect class="o" x="4" y="3" width="1" height="4" />
  <rect class="o" x="7" y="3" width="1" height="2" />
  <rect class="g1" x="5" y="3" width="2" height="4" />
  <rect class="p" x="5" y="4" width="1" height="2" />

  <rect class="o" x="15" y="2" width="2" height="1" />
  <rect class="o" x="14" y="3" width="1" height="2" />
  <rect class="o" x="17" y="3" width="1" height="4" />
  <rect class="g1" x="15" y="3" width="2" height="4" />
  <rect class="p" x="16" y="4" width="1" height="2" />

  <!-- Cabeza contorno -->
  <rect class="o" x="8" y="4" width="6" height="1" />
  <rect class="o" x="4" y="7" width="1" height="8" />
  <rect class="o" x="18" y="7" width="1" height="8" />
  <rect class="o" x="5" y="15" width="2" height="1" />
  <rect class="o" x="16" y="15" width="2" height="1" />
  <rect class="o" x="7" y="16" width="9" height="1" />

  <!-- Relleno Cabeza -->
  <rect class="g1" x="5" y="5" width="13" height="10" />
  <rect class="g3" x="6" y="5" width="11" height="2" />
  <rect class="g2" x="10" y="5" width="1" height="2" />
  <rect class="g2" x="12" y="5" width="1" height="3" />
  <rect class="g2" x="14" y="5" width="1" height="2" />
  <rect class="g2" x="5" y="11" width="2" height="1" />

  <!-- Mancha blanca facial -->
  <rect class="w" x="12" y="9" width="2" height="2" />
  <rect class="w" x="8" y="11" width="10" height="4" />
  <rect class="w" x="9" y="15" width="7" height="1" />

  <!-- Ojos -->
  <rect class="o" x="10" y="9" width="1" height="3" />
  <rect class="e" x="10" y="11" width="1" height="1" />

  <rect class="o" x="15" y="9" width="1" height="3" />
  <rect class="e" x="15" y="11" width="1" height="1" />

  <!-- Nariz y boca -->
  <rect class="p" x="13" y="12" width="1" height="1" />
  <rect class="o" x="12" y="13" width="3" height="1" />

  <!-- Bigotes -->
  <rect class="o" x="3" y="12" width="2" height="1" />
  <rect class="o" x="18" y="12" width="2" height="1" />

  <!-- Torso / Camisa -->
  <rect class="o" x="6" y="17" width="11" height="1" />
  <rect class="o" x="5" y="18" width="1" height="9" />
  <rect class="o" x="17" y="18" width="1" height="8" />
  <rect class="s1" x="6" y="18" width="11" height="8" />
  <rect class="s2" x="6" y="18" width="3" height="8" />
  <rect class="w" x="11" y="18" width="4" height="1" />

  <!-- Corbata -->
  <rect class="o" x="13" y="18" width="1" height="7" />
  <rect class="t" x="13" y="19" width="1" height="5" />

  <!-- Gafete -->
  <rect class="o" x="10" y="18" width="1" height="3" />
  <rect class="o" x="10" y="21" width="3" height="4" />
  <rect class="l" x="11" y="22" width="1" height="2" />

  <!-- Brazo delantero flexionado (apoyado sobre el muslo) -->
  <rect class="o" x="4" y="18" width="2" height="1" />
  <rect class="o" x="3" y="19" width="1" height="6" />
  <rect class="o" x="4" y="25" width="7" height="1" />
  <rect class="o" x="7" y="20" width="1" height="3" />
  <rect class="o" x="8" y="23" width="3" height="1" />
  <rect class="o" x="11" y="24" width="1" height="1" />
  <rect class="s1" x="4" y="19" width="3" height="4" />
  <rect class="s2" x="4" y="19" width="1" height="6" />
  <rect class="s1" x="4" y="23" width="5" height="2" />
  <rect class="w" x="9" y="24" width="2" height="1" />

  <!-- Cinturón -->
  <rect class="o" x="6" y="26" width="11" height="1" />
  <rect class="l" x="12" y="26" width="2" height="1" />

  <!-- Pantalón en postura sentada (muslos horizontales hacia adelante y rodillas bajando) -->
  <rect class="o" x="5" y="27" width="1" height="4" />
  <rect class="o" x="6" y="31" width="6" height="1" />
  <rect class="o" x="17" y="26" width="4" height="1" />
  <rect class="o" x="21" y="27" width="1" height="8" />
  <rect class="o" x="12" y="32" width="1" height="4" />
  <rect class="o" x="16" y="31" width="1" height="4" />

  <!-- Relleno muslos y piernas -->
  <rect class="t" x="6" y="27" width="15" height="4" />
  <rect class="t2" x="6" y="27" width="2" height="4" />
  <rect class="t2" x="11" y="29" width="5" height="1" />
  <!-- Pantorrilla delantera (izquierda) -->
  <rect class="t" x="13" y="31" width="3" height="5" />
  <rect class="t2" x="13" y="31" width="1" height="5" />
  <!-- Pantorrilla trasera (derecha) -->
  <rect class="t" x="17" y="31" width="4" height="4" />
  <rect class="t2" x="20" y="31" width="1" height="4" />

  <!-- Zapatos isométricos -->
  <rect class="o" x="13" y="36" width="6" height="3" />
  <rect class="b" x="14" y="37" width="4" height="1" />

  <rect class="o" x="18" y="35" width="6" height="3" />
  <rect class="b" x="19" y="36" width="4" height="1" />
</svg>