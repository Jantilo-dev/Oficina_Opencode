<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 44" width="144" height="264">
  <defs>
    <style>
      .o  { fill: #18181b; } /* Contorno negro */
      .g1 { fill: #757980; } /* Pelaje gris medio */
      .g2 { fill: #52555c; } /* Pelaje gris oscuro / rayas */
      .g3 { fill: #989ca3; } /* Pelaje gris claro */
      .w  { fill: #f4f4f6; } /* Blanco hocico / patas */
      .p  { fill: #e39696; } /* Rosa orejas / nariz */
      .e  { fill: #3b82f6; } /* Ojos azules */
      .s1 { fill: #d6cfc2; } /* Camisa beige */
      .s2 { fill: #b5ada0; } /* Sombra camisa */
      .t  { fill: #2f3136; } /* Corbata / pantalón */
      .t2 { fill: #1f2024; } /* Sombra pantalón */
      .b  { fill: #4a3728; } /* Zapatos */
      .l  { fill: #9ca3af; } /* Gafete / hebilla */
      .sh { fill: #000000; opacity: 0.2; } /* Sombra piso */
    </style>
  </defs>

  <!-- Sombra isométrica en el suelo -->
  <rect class="sh" x="4" y="40" width="14" height="2" />
  <rect class="sh" x="6" y="39" width="10" height="4" />

  <!-- Cola (asomando atrás a la izquierda) -->
  <rect class="o" x="1" y="29" width="3" height="1" />
  <rect class="o" x="0" y="30" width="1" height="3" />
  <rect class="o" x="4" y="30" width="1" height="2" />
  <rect class="o" x="1" y="33" width="3" height="1" />
  <rect class="g1" x="2" y="30" width="2" height="1" />
  <rect class="g2" x="1" y="31" width="2" height="1" />
  <rect class="w" x="1" y="32" width="2" height="1" />

  <!-- Orejas -->
  <!-- Oreja trasera (izquierda) -->
  <rect class="o" x="5" y="2" width="2" height="1" />
  <rect class="o" x="4" y="3" width="1" height="4" />
  <rect class="o" x="7" y="3" width="1" height="2" />
  <rect class="g1" x="5" y="3" width="2" height="4" />
  <rect class="p" x="5" y="4" width="1" height="2" />

  <!-- Oreja delantera (derecha) -->
  <rect class="o" x="15" y="2" width="2" height="1" />
  <rect class="o" x="14" y="3" width="1" height="2" />
  <rect class="o" x="17" y="3" width="1" height="4" />
  <rect class="g1" x="15" y="3" width="2" height="4" />
  <rect class="p" x="16" y="4" width="1" height="2" />

  <!-- Cabeza contorno (bloque isométrico) -->
  <rect class="o" x="8" y="4" width="6" height="1" />
  <rect class="o" x="4" y="7" width="1" height="8" />
  <rect class="o" x="18" y="7" width="1" height="8" />
  <rect class="o" x="5" y="15" width="2" height="1" />
  <rect class="o" x="16" y="15" width="2" height="1" />
  <rect class="o" x="7" y="16" width="9" height="1" />

  <!-- Relleno Cabeza -->
  <rect class="g1" x="5" y="5" width="13" height="10" />
  <rect class="g3" x="6" y="5" width="11" height="2" />
  <!-- Rayas atigradas -->
  <rect class="g2" x="10" y="5" width="1" height="2" />
  <rect class="g2" x="12" y="5" width="1" height="3" />
  <rect class="g2" x="14" y="5" width="1" height="2" />
  <rect class="g2" x="5" y="11" width="2" height="1" />

  <!-- Mancha blanca facial (orientada 3/4 derecha) -->
  <rect class="w" x="12" y="9" width="2" height="2" />
  <rect class="w" x="8" y="11" width="10" height="4" />
  <rect class="w" x="9" y="15" width="7" height="1" />

  <!-- Ojos (estilo punto vertical expresivo) -->
  <rect class="o" x="10" y="9" width="1" height="3" />
  <rect class="e" x="10" y="11" width="1" height="1" />

  <rect class="o" x="15" y="9" width="1" height="3" />
  <rect class="e" x="15" y="11" width="1" height="1" />

  <!-- Nariz y boca -->
  <rect class="p" x="13" y="12" width="1" height="1" />
  <rect class="o" x="12" y="13" width="3" height="1" />

  <!-- Bigotes -->
  <rect class="o" x="3" y="12" width="2" height="1" />
  <rect class="o" x="18" y="12" width="2" height="1" />

  <!-- Torso / Camisa -->
  <rect class="o" x="6" y="17" width="11" height="1" />
  <rect class="o" x="17" y="18" width="1" height="9" />
  <rect class="s1" x="7" y="18" width="10" height="9" />
  <rect class="s2" x="7" y="18" width="3" height="9" />
  <!-- Cuello camisa -->
  <rect class="w" x="11" y="18" width="4" height="1" />

  <!-- Corbata (desplazada a la derecha por perspectiva 3/4) -->
  <rect class="o" x="13" y="18" width="1" height="8" />
  <rect class="t" x="13" y="19" width="1" height="6" />

  <!-- Gafete / Credencial -->
  <rect class="o" x="10" y="18" width="1" height="4" />
  <rect class="o" x="10" y="22" width="3" height="4" />
  <rect class="l" x="11" y="23" width="1" height="2" />

  <!-- Brazo delantero (izquierda en pantalla, en primer plano) -->
  <rect class="o" x="4" y="18" width="2" height="1" />
  <rect class="o" x="3" y="19" width="1" height="8" />
  <rect class="o" x="7" y="20" width="1" height="7" />
  <rect class="o" x="4" y="27" width="3" height="1" />
  <rect class="s1" x="4" y="19" width="3" height="6" />
  <rect class="s2" x="4" y="19" width="1" height="6" />
  <rect class="w" x="4" y="25" width="3" height="2" />

  <!-- Brazo trasero (asomando a la derecha) -->
  <rect class="o" x="18" y="20" width="1" height="6" />
  <rect class="o" x="17" y="26" width="2" height="1" />
  <rect class="s2" x="17" y="20" width="1" height="4" />
  <rect class="w" x="17" y="24" width="1" height="2" />

  <!-- Cinturón -->
  <rect class="o" x="6" y="27" width="11" height="1" />
  <rect class="l" x="12" y="27" width="2" height="1" />

  <!-- Pantalón (piernas en bloque) -->
  <rect class="o" x="6" y="28" width="1" height="9" />
  <rect class="o" x="11" y="31" width="1" height="6" />
  <rect class="o" x="16" y="28" width="1" height="9" />

  <rect class="t" x="7" y="28" width="9" height="3" />
  <rect class="t" x="7" y="31" width="4" height="6" />
  <rect class="t2" x="7" y="31" width="1" height="6" />
  <rect class="t" x="12" y="31" width="4" height="6" />
  <rect class="t2" x="15" y="31" width="1" height="6" />

  <!-- Zapatos isométricos -->
  <rect class="o" x="6" y="37" width="6" height="3" />
  <rect class="b" x="7" y="38" width="4" height="1" />

  <rect class="o" x="12" y="37" width="6" height="3" />
  <rect class="b" x="13" y="38" width="4" height="1" />
</svg>